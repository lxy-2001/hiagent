    Citation:
      type: object
      additionalProperties: false
      required:
      - id
      - snapshotId
      - docId
      - documentVersion
      - chunkId
      - contentHash
      - sourcePath
      - title
      - start
      - end
      - excerpt
      properties:
        id:
          type: string
          pattern: ^S(?:[1-9]|[12][0-9]|3[0-2])$
        snapshotId: &id004
          type: string
          pattern: ^[0-9a-f]{64}$
        docId: *id004
        documentVersion: *id004
        chunkId: *id004
        contentHash: *id004
        sourcePath:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^(?!/)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*[\\:\u0000-\u001f])[^/]+(?:/[^/]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 120
        start:
          type: integer
          minimum: 0
          maximum: 1048576
        end:
          type: integer
          minimum: 1
          maximum: 1048576
        excerpt:
          type: string
          minLength: 1
          maxLength: 800
      description: Source snapshot. Runtime checks code-point range, SHA-256, unique
        id and UTF-16 metadata lengths; schema alone does not prove provenance.
    ApprovalSnapshot:
      type: object
      additionalProperties: false
      required:
      - approvalId
      - taskId
      - runId
      - callId
      - toolName
      - serverId
      - remoteToolName
      - risk
      - actionSummary
      - argumentPreview
      - argumentsDigest
      - definitionVersion
      - policyVersion
      - status
      - createdAt
      - expiresAt
      - decidedAt
      - decisionSource
      - dispatchCount
      - outcome
      - waitMillis
      properties:
        approvalId: *id002
        taskId: *id002
        runId: *id002
        callId:
          type: string
          minLength: 1
          maxLength: 128
        toolName:
          type: string
          maxLength: 100
        serverId:
          type:
          - string
          - 'null'
          maxLength: 32
        remoteToolName:
          type:
          - string
          - 'null'
          maxLength: 64
        risk:
          enum:
          - LOW
          - MEDIUM
          - HIGH
        actionSummary:
          type: string
          minLength: 1
          maxLength: 256
        argumentPreview:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - value
            - masked
            - truncated
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 64
              value:
                type: string
                maxLength: 256
              masked:
                type: boolean
              truncated:
                type: boolean
        argumentsDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
        definitionVersion:
          type: string
          pattern: ^[a-f0-9]{64}$
        policyVersion:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
          - CANCELLED
          - INVALIDATED
          - INTERRUPTED
        createdAt: *id003
        expiresAt: *id003
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
        decisionSource:
          enum:
          - null
          - USER
          - TTL
          - RUN_TIMEOUT
          - CANCEL
          - POLICY
          - PROCESS
        dispatchCount:
          type: integer
          minimum: 0
          maximum: 1
        outcome:
          enum:
          - NOT_DISPATCHED
          - SUCCEEDED
          - FAILED
          - UNKNOWN
        waitMillis:
          type:
          - integer
          - 'null'
          minimum: 0
      allOf:
      - if:
          properties:
            status:
              const: PENDING
          required:
          - status
        then:
          properties:
            decidedAt:
              type: 'null'
            decisionSource:
              type: 'null'
            dispatchCount:
              const: 0
            outcome:
              const: NOT_DISPATCHED
            waitMillis:
              type: 'null'
        else:
          properties:
            decidedAt: *id003
            decisionSource:
              enum: *id005
            waitMillis:
              description: Null if interruption prevents a monotonic duration measurement.
              type: [integer, "null"]
              minimum: 0
      - if:
          properties:
            status:
              enum:
              - REJECTED
              - EXPIRED
              - CANCELLED
              - INVALIDATED
              - INTERRUPTED
          required:
          - status
        then:
          properties:
            dispatchCount:
              const: 0
            outcome:
              const: NOT_DISPATCHED
    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          enum:
          - APPROVE
          - REJECT
    ApprovalList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ApprovalSnapshot'
x-run-invariants:
- taskId == runId
- Non-success errorCode == terminationReason
- Length budgets use UTF-16 code units; transport frames use UTF-8 bytes
- Publish state events only after persistence confirmation
- APPROVED does not imply dispatch or remote success
x-baseline-commit: 8c722e3
x-constraints:
- Citation snapshot JSON <= 65536 UTF-8 bytes
- Non-success citations are empty
- Approval preview JSON <= 4096 UTF-8 bytes
- Owner-only reads and decisions; raw tool arguments never exposed
- WAITING_APPROVAL is non-terminal; startedAt is retained on resume
