openapi: 3.1.0
info:
  title: HiAgent Feature003 Run API
  version: 0.3.3-design
  description: 全新设计，未实施。保留/api/agent/tasks；runId==taskId。服务端真实行为及迁移调整见spec/plan，不承诺旧SSE消费者免改。
servers:
- url: /
security:
- BearerAuth: []
paths:
  /api/agent/tasks:
    post:
      operationId: createAgentRun
      summary: 创建并排队一个任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '202':
          description: 已持久接受；回执status为QUEUED，当前状态由GET查询。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Location:
              schema:
                type: string
              description: /api/agent/tasks/{taskId}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/Capacity'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: 回执只表示持久接受。提交未确认时503可带固定taskId/Location；暂时GET不到记录不证明未接受，客户端不得自动重复POST。
  /api/agent/tasks/{taskId}:
    parameters:
    - name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 现有任务标识，也是runId。
    get:
      operationId: getAgentRun
      summary: 查询持久任务快照
      responses:
        '200':
          description: 已确认的持久快照；本Run存在不确定提交时503。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Capacity'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/agent/tasks/{taskId}/steps:
    parameters:
    - name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 现有任务标识，也是runId。
    get:
      operationId: getAgentRunSteps
      summary: 查询受控步骤投影
      responses:
        '200':
          description: 按stepNo递增；最多256条；完整性到任务快照读取。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                maxItems: 256
                items:
                  $ref: '#/components/schemas/StepResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Capacity'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/agent/tasks/{taskId}/cancel:
    parameters:
    - name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 现有任务标识，也是runId。
    post:
      operationId: cancelAgentRun
      summary: 协作取消；没有请求体
      responses:
        '200':
          description: 已经终态或排队取消已提交；重复调用无新副作用。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSnapshot'
        '202':
          description: 运行/开始阶段已接受取消信号，或原结果正在正常收尾；并不保证最后一定CANCELLED。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Capacity'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/agent/tasks/{taskId}/events:
    parameters:
    - name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 现有任务标识，也是runId。
    get:
      operationId: subscribeAgentRunEvents
      summary: 从最后处理的游标继续接收事件
      description: 详细握手顺序、边界和连接中断规则见events.md；无游标等价0。 Runtime返回后关闭观察入口，终态/失效窗口不接受迟到发布或重建。Demo有限重连和查询停止规则见events.md。
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18})$
          maxLength: 19
        description: 单个规范十进制int64，≤9223372036854775807；无空白/符号/前导零。
      responses:
        '200':
          description: SSE；终态发送后结束，最长60秒或JWT到期（取更早）。已建立连接落后窗口时关闭，不能改HTTP状态。
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                lifecycle:
                  summary: 简化流，Core序号可跳跃且与eventId不同；不是完整步骤轨迹。
                  value: 'id: 1

                    event: RUN_CREATED

                    data: {"eventId":"1","taskId":"11111111-1111-4111-8111-111111111111","runId":"11111111-1111-4111-8111-111111111111","type":"RUN_CREATED","occurredAt":"2026-09-15T02:00:00Z","payload":{"sessionId":"22222222-2222-4222-8222-222222222222","status":"QUEUED"}}


                    id: 2

                    event: RUN_STARTED

                    data: {"eventId":"2","taskId":"11111111-1111-4111-8111-111111111111","runId":"11111111-1111-4111-8111-111111111111","type":"RUN_STARTED","occurredAt":"2026-09-15T02:00:00Z","payload":{"status":"RUNNING","startedAt":"2026-09-15T02:00:00Z"}}


                    id: 3

                    event: AGENT_STEP

                    data: {"eventId":"3","taskId":"11111111-1111-4111-8111-111111111111","runId":"11111111-1111-4111-8111-111111111111","type":"AGENT_STEP","occurredAt":"2026-09-15T02:00:00Z","payload":{"coreSequence":"1","stepType":"MODEL_DECISION","name":"model","summary":"选择只读工具","correlationId":"decision-1","runtimeTerminal":false,"summaryTruncated":false}}


                    id: 4

                    event: AGENT_STEP

                    data: {"eventId":"4","taskId":"11111111-1111-4111-8111-111111111111","runId":"11111111-1111-4111-8111-111111111111","type":"AGENT_STEP","occurredAt":"2026-09-15T02:00:00Z","payload":{"coreSequence":"9","stepType":"TERMINATION","name":"termination","summary":"COMPLETED","correlationId":null,"runtimeTerminal":true,"summaryTruncated":false}}


                    id: 5

                    event: RUN_TERMINATED

                    data: {"eventId":"5","taskId":"11111111-1111-4111-8111-111111111111","runId":"11111111-1111-4111-8111-111111111111","type":"RUN_TERMINATED","occurredAt":"2026-09-15T02:00:00Z","payload":{"status":"SUCCEEDED","terminationReason":"COMPLETED","runtimeReason":"COMPLETED","finishedAt":"2026-09-15T02:00:00Z","recordingComplete":true}}


                    '
        '204':
          description: 已读完仍保留的终态，N=L；无body且不占订阅许可。
          headers:
            Cache-Control:
              schema:
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/Capacity'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: INVALID_REQUEST或INVALID_EVENT_CURSOR，非法游标不会创建订阅。
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: UNAUTHORIZED；未认证、失效身份。
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: NOT_FOUND；未知与非所有者一致。
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: EVENT_HISTORY_UNAVAILABLE；转任务与步骤查询。
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Capacity:
      description: RATE_LIMITED（通用前置限流，所有操作）或RUN_CAPACITY_EXCEEDED或SUBSCRIPTION_CAPACITY_EXCEEDED；无额外资源分配。
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: PERSISTENCE_UNAVAILABLE、DEPENDENCY_UNAVAILABLE或SERVICE_STOPPING。创建提交不确定时可含taskId与Location；取消请求可能已生效。
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
        Location:
          description: 仅创建已分配ID且结果不确定时提供，先查询而非自动重提。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: INTERNAL_ERROR；固定说明，不返回异常栈。
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required:
      - input
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 8000
          description: 不得仅含空白；服务端按UTF-16码元数校验≤8000，JSON Schema字符计数不替代该校验。
    RunAccepted:
      type: object
      additionalProperties: false
      required:
      - taskId
      - runId
      - sessionId
      - status
      properties:
        taskId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        status:
          const: QUEUED
      description: 接受时的回执，taskId与runId相等；status=QUEUED不是读取时状态，任务可能已开始或收尾。
    RunStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
      - TIMED_OUT
      - BUDGET_EXCEEDED
    TerminationReason:
      type: string
      enum:
      - COMPLETED
      - INVALID_INPUT
      - INVALID_DECISION
      - MODEL_ERROR
      - UNKNOWN_TOOL
      - DISABLED_TOOL
      - INVALID_TOOL_ARGUMENTS
      - TOOL_ERROR
      - TOOL_RESULT_INVALID
      - TOOL_RESULT_TOO_LARGE
      - CANCELLED
      - TIMED_OUT
      - BUDGET_EXCEEDED
      - QUEUE_TIMEOUT
      - DISPATCH_REJECTED
      - PERSISTENCE_UNAVAILABLE
      - INTERNAL_ERROR
      - INVALID_RUNTIME_RESULT
      - OUTPUT_TOO_LARGE
      - PROCESS_INTERRUPTED
      - LEGACY_FAILURE
    Usage:
      type: object
      additionalProperties: false
      required:
      - promptTokens
      - completionTokens
      - totalTokens
      properties:
        promptTokens:
          type: integer
          minimum: 0
          maximum: 2147483647
        completionTokens:
          type: integer
          minimum: 0
          maximum: 2147483647
        totalTokens:
          type: integer
          minimum: 0
          maximum: 2147483647
      description: Runtime报告值；不是账单或真实模型计量保证。不得按Step累加或把0解释为未知/免费。
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHORIZED
          - NOT_FOUND
          - RATE_LIMITED
          - DEPENDENCY_UNAVAILABLE
          - RUN_CAPACITY_EXCEEDED
          - SUBSCRIPTION_CAPACITY_EXCEEDED
          - INVALID_EVENT_CURSOR
          - EVENT_HISTORY_UNAVAILABLE
          - PERSISTENCE_UNAVAILABLE
          - SERVICE_STOPPING
          - INTERNAL_ERROR
        message:
          type: string
          maxLength: 200
        taskId:
          type: string
          format: uuid
    EventId:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      maxLength: 19
      description: 十进制int64正值，额外校验≤9223372036854775807；以字符串传输避免JavaScript精度丢失。
    RunSnapshot:
      type: object
      additionalProperties: false
      required:
      - taskId
      - runId
      - sessionId
      - status
      - input
      - finalAnswer
      - createdAt
      - updatedAt
      - startedAt
      - finishedAt
      - cancelRequested
      - terminationReason
      - runtimeReason
      - errorCode
      - recordingComplete
      - usage
      properties:
        taskId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunStatus'
        input:
          type: string
          maxLength: 8000
        finalAnswer:
          anyOf:
          - type: string
            maxLength: 65536
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        finishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        cancelRequested:
          type: boolean
        terminationReason:
          anyOf:
          - $ref: '#/components/schemas/TerminationReason'
          - type: 'null'
        runtimeReason:
          anyOf:
          - type: string
            enum:
            - COMPLETED
            - INVALID_INPUT
            - INVALID_DECISION
            - MODEL_ERROR
            - UNKNOWN_TOOL
            - DISABLED_TOOL
            - INVALID_TOOL_ARGUMENTS
            - TOOL_ERROR
            - TOOL_RESULT_INVALID
            - TOOL_RESULT_TOO_LARGE
            - CANCELLED
            - TIMED_OUT
            - BUDGET_EXCEEDED
          - type: 'null'
        errorCode:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
        recordingComplete:
          type: boolean
        usage:
          anyOf:
          - $ref: '#/components/schemas/Usage'
          - type: 'null'
      description: 语义不变量见data-model.md：终态字段、成功答案、失败原因、taskId==runId由真实响应契约测试校验。
      allOf:
      - if:
          properties:
            status:
              enum:
              - QUEUED
              - RUNNING
          required:
          - status
        then:
          properties:
            finishedAt:
              type: 'null'
            terminationReason:
              type: 'null'
            runtimeReason:
              type: 'null'
            errorCode:
              type: 'null'
            finalAnswer:
              type: 'null'
            usage:
              type: 'null'
            recordingComplete:
              const: false
      - if:
          properties:
            status:
              enum:
              - QUEUED
          required:
          - status
        then:
          properties:
            startedAt:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - RUNNING
          required:
          - status
        then:
          properties:
            startedAt:
              type: string
              format: date-time
      - if:
          properties:
            status:
              enum:
              - SUCCEEDED
              - FAILED
              - CANCELLED
              - TIMED_OUT
              - BUDGET_EXCEEDED
          required:
          - status
        then:
          properties:
            finishedAt:
              type: string
              format: date-time
            terminationReason:
              type: string
      - if:
          properties:
            status:
              enum:
              - SUCCEEDED
          required:
          - status
        then:
          properties:
            finalAnswer:
              type: string
              minLength: 1
            terminationReason:
              const: COMPLETED
            errorCode:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - FAILED
              - CANCELLED
              - TIMED_OUT
              - BUDGET_EXCEEDED
          required:
          - status
        then:
          properties:
            finalAnswer:
              type: 'null'
            errorCode:
              type: string
              minLength: 1
      - if:
          properties:
            status:
              enum:
              - CANCELLED
          required:
          - status
        then:
          properties:
            terminationReason:
              const: CANCELLED
      - if:
          properties:
            status:
              enum:
              - TIMED_OUT
          required:
          - status
        then:
          properties:
            terminationReason:
              enum:
              - TIMED_OUT
              - QUEUE_TIMEOUT
      - if:
          properties:
            status:
              enum:
              - BUDGET_EXCEEDED
          required:
          - status
        then:
          properties:
            terminationReason:
              const: BUDGET_EXCEEDED
      - if:
          properties:
            status:
              enum:
              - FAILED
          required:
          - status
        then:
          properties:
            terminationReason:
              enum:
              - INVALID_INPUT
              - INVALID_DECISION
              - MODEL_ERROR
              - UNKNOWN_TOOL
              - DISABLED_TOOL
              - INVALID_TOOL_ARGUMENTS
              - TOOL_ERROR
              - TOOL_RESULT_INVALID
              - TOOL_RESULT_TOO_LARGE
              - DISPATCH_REJECTED
              - PERSISTENCE_UNAVAILABLE
              - INTERNAL_ERROR
              - INVALID_RUNTIME_RESULT
              - OUTPUT_TOO_LARGE
              - PROCESS_INTERRUPTED
              - LEGACY_FAILURE
    StepResponse:
      type: object
      additionalProperties: false
      required:
      - stepNo
      - stepType
      - toolName
      - status
      - output
      - errorMessage
      - decisionId
      - callId
      - errorCode
      - terminal
      - latencyMs
      - promptTokens
      - completionTokens
      properties:
        stepNo:
          type: integer
          minimum: 1
          maximum: 256
        stepType:
          type: string
          enum:
          - PLANNER
          - MEMORY
          - RAG
          - LLM
          - MODEL_DECISION
          - TOOL
          - TOOL_CALL
          - TOOL_RESULT
          - HUMAN_APPROVAL
          - FINAL
          - FAILURE
          - TERMINATION
        toolName:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
        status:
          type: string
          enum:
          - RUNNING
          - SUCCESS
          - FAILED
          - SKIPPED
        output:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        errorMessage:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
        decisionId:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
        callId:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
        errorCode:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
        terminal:
          type: boolean
        latencyMs:
          type: integer
          minimum: 0
          format: int64
        promptTokens:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
        completionTokens:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 2147483647
          - type: 'null'
    RunEvent:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - eventId
        - taskId
        - runId
        - type
        - occurredAt
        - payload
        properties:
          eventId:
            $ref: '#/components/schemas/EventId'
          taskId:
            type: string
            format: uuid
          runId:
            type: string
            format: uuid
          type:
            const: RUN_CREATED
          occurredAt:
            type: string
            format: date-time
          payload:
            type: object
            additionalProperties: false
            required:
            - sessionId
            - status
            properties:
              sessionId:
                type: string
                format: uuid
              status:
                const: QUEUED
      - type: object
        additionalProperties: false
        required:
        - eventId
        - taskId
        - runId
        - type
        - occurredAt
        - payload
        properties:
          eventId:
            $ref: '#/components/schemas/EventId'
          taskId:
            type: string
            format: uuid
          runId:
            type: string
            format: uuid
          type:
            const: RUN_STARTED
          occurredAt:
            type: string
            format: date-time
          payload:
            type: object
            additionalProperties: false
            required:
            - status
            - startedAt
            properties:
              status:
                const: RUNNING
              startedAt:
                type: string
                format: date-time
      - type: object
        additionalProperties: false
        required:
        - eventId
        - taskId
        - runId
        - type
        - occurredAt
        - payload
        properties:
          eventId:
            $ref: '#/components/schemas/EventId'
          taskId:
            type: string
            format: uuid
          runId:
            type: string
            format: uuid
          type:
            const: AGENT_STEP
          occurredAt:
            type: string
            format: date-time
          payload:
            type: object
            additionalProperties: false
            required:
            - coreSequence
            - stepType
            - name
            - summary
            - correlationId
            - runtimeTerminal
            - summaryTruncated
            properties:
              coreSequence:
                type: string
                pattern: ^(0|[1-9][0-9]{0,18})$
                description: 原Core非负int64序号，以字符串传输。
              stepType:
                type: string
                enum:
                - PLANNER
                - MEMORY
                - RAG
                - LLM
                - MODEL_DECISION
                - TOOL
                - TOOL_CALL
                - TOOL_RESULT
                - HUMAN_APPROVAL
                - FINAL
                - FAILURE
                - TERMINATION
              name:
                type: string
                maxLength: 100
              summary:
                type: string
                maxLength: 1024
              correlationId:
                anyOf:
                - type: string
                  maxLength: 128
                - type: 'null'
              runtimeTerminal:
                type: boolean
              summaryTruncated:
                type: boolean
      - type: object
        additionalProperties: false
        required:
        - eventId
        - taskId
        - runId
        - type
        - occurredAt
        - payload
        properties:
          eventId:
            $ref: '#/components/schemas/EventId'
          taskId:
            type: string
            format: uuid
          runId:
            type: string
            format: uuid
          type:
            const: RUN_TERMINATED
          occurredAt:
            type: string
            format: date-time
          payload:
            type: object
            additionalProperties: false
            required:
            - status
            - terminationReason
            - runtimeReason
            - finishedAt
            - recordingComplete
            properties:
              status:
                type: string
                enum:
                - SUCCEEDED
                - FAILED
                - CANCELLED
                - TIMED_OUT
                - BUDGET_EXCEEDED
              terminationReason:
                $ref: '#/components/schemas/TerminationReason'
              runtimeReason:
                anyOf:
                - type: string
                  enum:
                  - COMPLETED
                  - INVALID_INPUT
                  - INVALID_DECISION
                  - MODEL_ERROR
                  - UNKNOWN_TOOL
                  - DISABLED_TOOL
                  - INVALID_TOOL_ARGUMENTS
                  - TOOL_ERROR
                  - TOOL_RESULT_INVALID
                  - TOOL_RESULT_TOO_LARGE
                  - CANCELLED
                  - TIMED_OUT
                  - BUDGET_EXCEEDED
                - type: 'null'
              finishedAt:
                type: string
                format: date-time
              recordingComplete:
                type: boolean
x-run-invariants:
- taskId == runId
- 非成功errorCode == terminationReason
- 长度限制按UTF-16；最终SSE帧按UTF-8字节
- 终态事件只在最终事务确认后发布
