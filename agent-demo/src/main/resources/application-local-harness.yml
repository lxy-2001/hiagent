spring:
  datasource:
    url: jdbc:h2:file:${agentflow.harness.storage.data-root}/db/hiagent;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=2000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      data-source-properties:
        connectTimeout: null
        socketTimeout: null
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
agentflow:
  harness:
    enabled: false
    storage:
      data-root: ${LOCALAPPDATA:${user.home}}/HiAgent
