spring:
  datasource:
    url: jdbc:h2:file:${agentflow.harness.storage.data-root}/db/hiagent;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=2000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      data-source-properties:
        connectTimeout: null
        socketTimeout: null
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
agentflow:
  harness:
    enabled: ${AGENTFLOW_HARNESS_ENABLED:true}
    model:
      protocol: responses
      name: ${AGENTFLOW_HARNESS_MODEL:gpt-6.1-sol}
      base-url: ${AGENTFLOW_HARNESS_BASE_URL:https://api.openai.com/v1}
      api-key: ${AGENTFLOW_HARNESS_API_KEY:${OPENAI_API_KEY:}}
    storage:
      data-root: ${LOCALAPPDATA:${user.home}}/HiAgent
