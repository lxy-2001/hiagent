<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentFlow Java</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f6f7f9;
            color: #172033;
        }

        body {
            margin: 0;
        }

        header {
            background: #18263b;
            color: #fff;
            padding: 20px 32px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 0;
        }

        header p {
            margin: 6px 0 0;
            color: #d8e1ef;
            font-size: 14px;
        }

        main {
            max-width: 1180px;
            margin: 24px auto;
            padding: 0 20px 40px;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        section {
            background: #fff;
            border: 1px solid #dde3ec;
            border-radius: 8px;
            padding: 18px;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 17px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-size: 13px;
            color: #526176;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cdd6e3;
            border-radius: 6px;
            padding: 10px 12px;
            font: inherit;
            background: #fff;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            border: 0;
            border-radius: 6px;
            background: #1f6feb;
            color: #fff;
            padding: 10px 14px;
            margin-top: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        button.secondary {
            background: #42526b;
            margin-left: 8px;
        }

        button:disabled {
            background: #aeb9c8;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #526176;
            min-height: 20px;
        }

        .output {
            white-space: pre-wrap;
            background: #0f1724;
            color: #dbeafe;
            border-radius: 8px;
            padding: 14px;
            min-height: 280px;
            overflow: auto;
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
        }

        .steps {
            display: grid;
            gap: 10px;
            margin-top: 14px;
        }

        .step {
            border: 1px solid #dde3ec;
            border-radius: 8px;
            padding: 10px;
            background: #fbfcfe;
        }

        .step strong {
            color: #172033;
        }

        .step pre {
            white-space: pre-wrap;
            margin: 8px 0 0;
            color: #36465d;
            font-size: 12px;
            line-height: 1.45;
        }

        @media (max-width: 860px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>AgentFlow-Java</h1>
    <p>Spring Boot Agent Runtime MVP</p>
</header>
<main>
    <section>
        <h2>控制台</h2>
        <label for="username">用户名</label>
        <input id="username" placeholder="请输入已配置的用户名" autocomplete="username">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入已配置的密码" autocomplete="current-password">
        <p class="hint">管理员账号需通过 AGENTFLOW_INITIAL_ADMIN_USERNAME / AGENTFLOW_INITIAL_ADMIN_PASSWORD 显式配置。</p>
        <button id="loginBtn">登录</button>
        <div id="loginStatus" class="status"></div>

        <h2>会话</h2>
        <button id="newSessionBtn" class="secondary">新建会话</button>
        <button id="refreshSessionsBtn" disabled>刷新会话</button>
        <select id="sessionSelect" aria-label="选择会话"><option value="">新会话</option></select>
        <button id="moreSessionsBtn" disabled>更多会话</button>
        <div id="conversationStatus" class="status"></div>
        <div id="history" class="steps"></div>
        <button id="moreTurnsBtn" disabled>更多历史</button>
        <h2>已确认记忆</h2>
        <p>仅保存你明确提交的编程语言偏好和项目技术栈。</p>
        <div id="memories"></div>
        <button id="refreshMemoryBtn" disabled>重新读取记忆</button>
        <label for="taskInput">任务</label>
        <textarea id="taskInput">帮我设计一个秒杀库存扣减接口，要求考虑 Redis 缓存、MySQL 一致性和并发安全。</textarea>
        <label><input id="requireEvidence" type="checkbox">必须提供当前知识库引用</label>
        <button id="runBtn" disabled>运行 Agent</button>
        <button id="cancelBtn" class="secondary" disabled>取消运行</button>
        <div id="taskStatus" class="status"></div>
    </section>

    <section>
        <h2>执行结果</h2>
        <div id="output" class="output"></div>
        <div id="steps" class="steps"></div>
        <h2>引用来源</h2>
        <p>引用校验证明片段来源与送达，不保证答案在语义上正确。知识库需离线导入并显式启用。</p>
        <div id="citations" class="steps"></div>
    </section>
</main>

<script type="module">
    import {observeRun} from "/run-events.js";
    import {createConversationClient} from "/conversation.js";
    let accessToken = "";
    let refreshToken = "";
    let currentTaskId = "";
    let currentObserver = null;
    let observationGeneration = 0;

    const output = document.querySelector("#output");
    const steps = document.querySelector("#steps");
    const conversation = createConversationClient(authedFetch);
    let selectionGeneration = 0;
    let nextBefore = null;
    let nextAfter = "0";
    let untilSequence = null;
    const conversationStatus = document.querySelector("#conversationStatus");
    function stopObservation() {
        currentObserver?.stop();
        observationGeneration++;
        currentTaskId = "";
        document.querySelector("#cancelBtn").disabled = true;
    }
    function reportConversationError(error) { conversationStatus.textContent = error.message; }
    async function refreshSessions(append = false) {
        const generation = selectionGeneration;
        try {
            const page = await conversation.list(append ? nextBefore : null);
            if (generation !== selectionGeneration) return;
            const select = document.querySelector("#sessionSelect");
            const selected = select.value;
            if (!append) select.replaceChildren(new Option("新会话", ""));
            page.items.forEach(item => select.add(new Option(item.title || item.sessionId, item.sessionId)));
            if (selected) select.value = selected;
            nextBefore = page.nextBefore;
            document.querySelector("#moreSessionsBtn").disabled = !page.hasMore;
        } catch (error) { if (generation === selectionGeneration) reportConversationError(error); }
    }
    async function refreshTurns(append = false) {
        const generation = selectionGeneration;
        try {
            const page = await conversation.turns(append ? nextAfter : "0", append ? untilSequence : null);
            if (generation !== selectionGeneration) return;
            const history = document.querySelector("#history");
            if (!append) history.replaceChildren();
            for (const turn of page.items) {
                const row = document.createElement("pre");
                row.textContent = `#${turn.turnSequence} ${turn.status}\n${turn.contentUnavailable ? "内容超出展示上限" : (turn.input || "") + "\n" + (turn.finalAnswer || "")}`;
                history.append(row);
            }
            nextAfter = page.nextAfterSequence;
            untilSequence = page.untilSequence;
            document.querySelector("#moreTurnsBtn").disabled = !page.hasMore;
        } catch (error) { if (generation === selectionGeneration) reportConversationError(error); }
    }
    async function refreshMemories() {
        const generation = selectionGeneration;
        try {
            const slots = await conversation.memories();
            if (generation !== selectionGeneration) return;
            const container = document.querySelector("#memories");
            container.replaceChildren();
            for (const slot of slots) {
                const row = document.createElement("div");
                const label = document.createElement("label");
                label.textContent = `${slot.key === "preferred_language" ? "编程语言偏好" : "项目技术栈"} · ${slot.state} · v${slot.version}`;
                const input = document.createElement("input");
                input.value = slot.value || "";
                input.maxLength = 512;
                label.append(input);
                const save = document.createElement("button");
                save.textContent = "确认保存";
                const remove = document.createElement("button");
                remove.textContent = "删除";
                async function write(deleting) {
                    if (generation !== selectionGeneration) return;
                    save.disabled = remove.disabled = true;
                    try {
                        if (deleting) await conversation.deleteMemory(slot.key, slot.version);
                        else await conversation.writeMemory(slot.key, input.value, slot.version);
                        if (generation === selectionGeneration) await refreshMemories();
                    } catch (error) { if (generation === selectionGeneration) reportConversationError(error); }
                    finally { save.disabled = remove.disabled = false; }
                }
                save.addEventListener("click", () => write(false));
                remove.addEventListener("click", () => write(true));
                row.append(label, save, remove);
                container.append(row);
            }
        } catch (error) { if (generation === selectionGeneration) reportConversationError(error); }
    }
    function selectSession(id) {
        selectionGeneration++;
        stopObservation();
        conversationStatus.textContent = id ? `当前会话：${id}` : "下一次运行将创建新会话";
        conversation.select(id || null);
        document.querySelector("#history").replaceChildren();
        document.querySelector("#memories").replaceChildren();
        document.querySelector("#moreTurnsBtn").disabled = true;
        document.querySelector("#refreshMemoryBtn").disabled = !id;
        output.textContent = "";
        steps.replaceChildren();
        document.querySelector("#citations").replaceChildren();
        if (id) { refreshTurns(); refreshMemories(); }
    }
    document.querySelector("#sessionSelect").addEventListener("change", event => selectSession(event.target.value));
    document.querySelector("#newSessionBtn").addEventListener("click", () => {
        document.querySelector("#sessionSelect").value = "";
        selectSession(null);
    });
    document.querySelector("#refreshSessionsBtn").addEventListener("click", () => refreshSessions());
    document.querySelector("#moreSessionsBtn").addEventListener("click", () => refreshSessions(true));
    document.querySelector("#moreTurnsBtn").addEventListener("click", () => refreshTurns(true));
    document.querySelector("#refreshMemoryBtn").addEventListener("click", refreshMemories);

    document.querySelector("#loginBtn").addEventListener("click", async () => {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                username: document.querySelector("#username").value,
                password: document.querySelector("#password").value
            })
        });
        if (!response.ok) {
            document.querySelector("#loginStatus").textContent = "登录失败";
            return;
        }
        const data = await response.json();
        selectSession(null);
        accessToken = data.accessToken;
        refreshToken = data.refreshToken;
        document.querySelector("#loginStatus").textContent = "已登录";
        document.querySelector("#runBtn").disabled = false;

        document.querySelector("#refreshSessionsBtn").disabled = false;
        await refreshSessions();
    });

    document.querySelector("#runBtn").addEventListener("click", async () => {
        currentObserver?.stop();
        const generation = ++observationGeneration;
        output.textContent = "";
        steps.replaceChildren();
        document.querySelector("#citations").replaceChildren();
        document.querySelector("#taskStatus").textContent = "正在提交";
        document.querySelector("#runBtn").disabled = true;
        try {
        const response = await authedFetch("/api/agent/tasks", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(conversation.request(document.querySelector("#taskInput").value, document.querySelector("#requireEvidence").checked))
        });
        const task = await response.json();
        if (generation !== observationGeneration) return;
        if (!response.ok) {
            document.querySelector("#taskStatus").textContent = `${task.code || response.status}：请检查后手动重试${task.taskId ? "；先查询任务 " + task.taskId : ""}`;
            return;
        }
        conversation.select(task.sessionId);
        conversationStatus.textContent = `当前会话：${task.sessionId}`;
        document.querySelector("#refreshMemoryBtn").disabled = false;
        refreshMemories();
        currentTaskId = task.taskId;
        document.querySelector("#cancelBtn").disabled = false;
        document.querySelector("#taskStatus").textContent = `运行中：${currentTaskId}`;
        currentObserver = observeRun({
            taskId: currentTaskId,
            token: accessToken,
            generation,
            isCurrent: value => value === observationGeneration,
            onEvent: appendEvent,
            onSnapshot: task => { if (generation === observationGeneration) renderSnapshot(task); },
            onSteps: renderSteps,
            onState: state => document.querySelector("#taskStatus").textContent = state
        });
        await currentObserver.start();
        if (generation === observationGeneration) { await refreshTurns(); await refreshSessions(); }
        } catch (error) {
            if (generation === observationGeneration) document.querySelector("#taskStatus").textContent = `请求未确认，请先检查历史后手动重试：${error.message}`;
        } finally { document.querySelector("#runBtn").disabled = false; }
    });

    document.querySelector("#cancelBtn").addEventListener("click", async () => {
        if (!currentTaskId) return;
        const response = await authedFetch(`/api/agent/tasks/${currentTaskId}/cancel`, {method: "POST"});
        document.querySelector("#taskStatus").textContent = response.ok
            ? "取消请求已处理，正在读取最终状态" : "取消状态暂时无法确认";
    });

    async function authedFetch(url, options = {}) {
        options.headers = Object.assign({}, options.headers || {}, {Authorization: `Bearer ${accessToken}`});
        return fetch(url, options);
    }

    function appendEvent(event) {
        output.textContent += `\n[${event.type}]\n${event.payload?.summary || ""}\n`;
        output.scrollTop = output.scrollHeight;
    }

    function renderSnapshot(task) {
        document.querySelector("#citations").replaceChildren(...(task.citations || []).map(citation => {
            const card = document.createElement("div");
            card.className = "step";
            const label = document.createElement("strong");
            label.textContent = `[${citation.id}] ${citation.title} — ${citation.sourcePath} (${citation.start}:${citation.end})`;
            const excerpt = document.createElement("pre");
            excerpt.textContent = citation.excerpt;
            card.append(label, excerpt);
            return card;
        }));
        document.querySelector("#taskStatus").textContent = `${task.status}：${task.taskId}`;
        document.querySelector("#cancelBtn").disabled = Boolean(task.finishedAt);
        if (task.finalAnswer) output.textContent += `\n[FINAL ANSWER]\n${task.finalAnswer}\n`;
        if (task.terminationReason) output.textContent += `\n[结束原因] ${task.terminationReason}\n`;
    }

    function renderSteps(data) {
        steps.replaceChildren(...data.map(step => {
            const card = document.createElement("div");
            card.className = "step";
            const title = document.createElement("strong");
            title.textContent = `#${step.stepNo} ${step.stepType}${step.toolName ? " / " + step.toolName : ""}`;
            const status = document.createElement("span");
            status.textContent = step.status;
            const detail = document.createElement("pre");
            detail.textContent = step.output || step.errorMessage || "";
            card.append(title, status, detail);
            return card;
        }));
    }

    window.addEventListener("pagehide", () => currentObserver?.stop());
</script>
</body>
</html>
