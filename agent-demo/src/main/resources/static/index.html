<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentFlow Java</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f6f7f9;
            color: #172033;
        }

        body {
            margin: 0;
        }

        header {
            background: #18263b;
            color: #fff;
            padding: 20px 32px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 0;
        }

        header p {
            margin: 6px 0 0;
            color: #d8e1ef;
            font-size: 14px;
        }

        main {
            max-width: 1180px;
            margin: 24px auto;
            padding: 0 20px 40px;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        section {
            background: #fff;
            border: 1px solid #dde3ec;
            border-radius: 8px;
            padding: 18px;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 17px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-size: 13px;
            color: #526176;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cdd6e3;
            border-radius: 6px;
            padding: 10px 12px;
            font: inherit;
            background: #fff;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            border: 0;
            border-radius: 6px;
            background: #1f6feb;
            color: #fff;
            padding: 10px 14px;
            margin-top: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        button.secondary {
            background: #42526b;
            margin-left: 8px;
        }

        button:disabled {
            background: #aeb9c8;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #526176;
            min-height: 20px;
        }

        .output {
            white-space: pre-wrap;
            background: #0f1724;
            color: #dbeafe;
            border-radius: 8px;
            padding: 14px;
            min-height: 280px;
            overflow: auto;
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
        }

        .steps {
            display: grid;
            gap: 10px;
            margin-top: 14px;
        }

        .step {
            border: 1px solid #dde3ec;
            border-radius: 8px;
            padding: 10px;
            background: #fbfcfe;
        }

        .step strong {
            color: #172033;
        }

        .step pre {
            white-space: pre-wrap;
            margin: 8px 0 0;
            color: #36465d;
            font-size: 12px;
            line-height: 1.45;
        }

        @media (max-width: 860px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>AgentFlow-Java</h1>
    <p>Spring Boot Agent Runtime MVP</p>
</header>
<main>
    <section>
        <h2>控制台</h2>
        <label for="username">用户名</label>
        <input id="username" placeholder="请输入已配置的用户名" autocomplete="username">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入已配置的密码" autocomplete="current-password">
        <p class="hint">管理员账号需通过 AGENTFLOW_INITIAL_ADMIN_USERNAME / AGENTFLOW_INITIAL_ADMIN_PASSWORD 显式配置。</p>
        <button id="loginBtn">登录</button>
        <button id="reloadBtn" class="secondary" disabled>重载知识库</button>
        <div id="loginStatus" class="status"></div>

        <label for="taskInput">任务</label>
        <textarea id="taskInput">帮我设计一个秒杀库存扣减接口，要求考虑 Redis 缓存、MySQL 一致性和并发安全。</textarea>
        <button id="runBtn" disabled>运行 Agent</button>
        <button id="cancelBtn" class="secondary" disabled>取消运行</button>
        <div id="taskStatus" class="status"></div>
    </section>

    <section>
        <h2>执行结果</h2>
        <div id="output" class="output"></div>
        <div id="steps" class="steps"></div>
    </section>
</main>

<script type="module">
    import {observeRun} from "/run-events.js";
    let accessToken = "";
    let refreshToken = "";
    let currentTaskId = "";
    let currentObserver = null;
    let observationGeneration = 0;

    const output = document.querySelector("#output");
    const steps = document.querySelector("#steps");

    document.querySelector("#loginBtn").addEventListener("click", async () => {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                username: document.querySelector("#username").value,
                password: document.querySelector("#password").value
            })
        });
        if (!response.ok) {
            document.querySelector("#loginStatus").textContent = "登录失败";
            return;
        }
        const data = await response.json();
        accessToken = data.accessToken;
        refreshToken = data.refreshToken;
        document.querySelector("#loginStatus").textContent = "已登录";
        document.querySelector("#runBtn").disabled = false;
        document.querySelector("#reloadBtn").disabled = false;
    });

    document.querySelector("#reloadBtn").addEventListener("click", async () => {
        const data = await authedFetch("/api/knowledge/reload", {method: "POST"}).then(r => r.json());
        document.querySelector("#loginStatus").textContent = `知识库导入 ${data.importedCount} 个文件`;
    });

    document.querySelector("#runBtn").addEventListener("click", async () => {
        currentObserver?.stop();
        const generation = ++observationGeneration;
        output.textContent = "";
        steps.innerHTML = "";
        document.querySelector("#taskStatus").textContent = "任务已提交";
        const response = await authedFetch("/api/agent/tasks", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({input: document.querySelector("#taskInput").value})
        });
        const task = await response.json();
        currentTaskId = task.taskId;
        document.querySelector("#cancelBtn").disabled = false;
        document.querySelector("#taskStatus").textContent = `运行中：${currentTaskId}`;
        currentObserver = observeRun({
            taskId: currentTaskId,
            token: accessToken,
            generation,
            isCurrent: value => value === observationGeneration,
            onEvent: appendEvent,
            onSnapshot: renderSnapshot,
            onSteps: renderSteps,
            onState: state => document.querySelector("#taskStatus").textContent = state
        });
        await currentObserver.start();
    });

    document.querySelector("#cancelBtn").addEventListener("click", async () => {
        if (!currentTaskId) return;
        const response = await authedFetch(`/api/agent/tasks/${currentTaskId}/cancel`, {method: "POST"});
        document.querySelector("#taskStatus").textContent = response.ok
            ? "取消请求已处理，正在读取最终状态" : "取消状态暂时无法确认";
    });

    async function authedFetch(url, options = {}) {
        options.headers = Object.assign({}, options.headers || {}, {Authorization: `Bearer ${accessToken}`});
        return fetch(url, options);
    }

    function appendEvent(event) {
        output.textContent += `\n[${event.type}]\n${event.payload?.summary || ""}\n`;
        output.scrollTop = output.scrollHeight;
    }

    function renderSnapshot(task) {
        document.querySelector("#taskStatus").textContent = `${task.status}：${task.taskId}`;
        document.querySelector("#cancelBtn").disabled = Boolean(task.finishedAt);
        if (task.finalAnswer) output.textContent += `\n[FINAL ANSWER]\n${task.finalAnswer}\n`;
        if (task.terminationReason) output.textContent += `\n[结束原因] ${task.terminationReason}\n`;
    }

    function renderSteps(data) {
        steps.replaceChildren(...data.map(step => {
            const card = document.createElement("div");
            card.className = "step";
            const title = document.createElement("strong");
            title.textContent = `#${step.stepNo} ${step.stepType}${step.toolName ? " / " + step.toolName : ""}`;
            const status = document.createElement("span");
            status.textContent = step.status;
            const detail = document.createElement("pre");
            detail.textContent = step.output || step.errorMessage || "";
            card.append(title, status, detail);
            return card;
        }));
    }

    window.addEventListener("pagehide", () => currentObserver?.stop());
</script>
</body>
</html>
