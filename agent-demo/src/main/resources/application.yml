server:
  port: 8080

spring:
  application:
    name: agent-demo-dev-assistant
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2000
        socketTimeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

agentflow:
  rag:
    enabled: ${AGENTFLOW_RAG_ENABLED:false}
    store-directory: ${AGENTFLOW_RAG_STORE_DIRECTORY:}
    embedding-space-id: ${AGENTFLOW_RAG_EMBEDDING_SPACE_ID:}
    allow-keyword-fallback: ${AGENTFLOW_RAG_ALLOW_KEYWORD_FALLBACK:false}
    qdrant:
      base-url: ${QDRANT_BASE_URL:http://localhost:6333}
      api-key: ${QDRANT_API_KEY:}
  model:
    provider: ${AGENTFLOW_MODEL_PROVIDER:deepseek}
    base-url: ${AGENTFLOW_MODEL_BASE_URL:}
    api-key: ${AGENTFLOW_MODEL_API_KEY:}
    chat-model: ${AGENTFLOW_MODEL_CHAT_MODEL:deepseek-v4-pro}
    embedding-model: ${AGENTFLOW_MODEL_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dimensions: ${AGENTFLOW_MODEL_EMBEDDING_DIMENSIONS:2048}
    embedding-base-url: ${AGENTFLOW_MODEL_EMBEDDING_BASE_URL:}
    embedding-api-key: ${AGENTFLOW_MODEL_EMBEDDING_API_KEY:}
  tools:
    max-steps: 6
  security:
    jwt:
      secret: ${AGENTFLOW_JWT_SECRET}
      access-token-ttl: 30m
    refresh-token-ttl: 7d
  mcp:
    enabled: false
  initial-admin:
    username: ${AGENTFLOW_INITIAL_ADMIN_USERNAME:}
    password: ${AGENTFLOW_INITIAL_ADMIN_PASSWORD:}
